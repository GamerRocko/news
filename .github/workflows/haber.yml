name: Haberleri güncelle

on:
  schedule:
    - cron: "*/10 * * * *"   # her 2 saatte bir (UTC); tam saat başından kaçınmak gecikmeyi azaltır
  workflow_dispatch:           # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: haber
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install feedparser trafilatura requests

      - name: Haber botunu çalıştır
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Varsayılanlar Gemini. Değiştirmek istersen repo Settings > Variables bölümünden tanımla:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.5-flash-lite' }}
        run: python haber_botu.py

      - name: Değişiklik varsa repoya kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add data site
          git diff --staged --quiet || (git commit -m "Haberler güncellendi" && git push)
