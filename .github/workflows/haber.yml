name: Haberleri güncelle

on:
  schedule:
    - cron: "30 1-23/2 * * *"   # 2 saatte bir, buçukta (Türkiye saatiyle 00:30, 02:30, 04:30 ...; UTC+3)
  workflow_dispatch:           # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: haber
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install feedparser trafilatura requests

      - name: Haber botunu çalıştır
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Varsayılanlar Gemini. Değiştirmek istersen repo Settings > Variables bölümünden tanımla:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.5-flash-lite' }}
        run: python haber_botu.py

      - name: Değişiklik varsa repoya kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add data site
          if ! git diff --staged --quiet; then
            git commit -m "Haberler güncellendi"
            # Çalışma sırasında repoya başka bir değişiklik geldiyse önce onu al, sonra tekrar dene.
            # Çakışma olursa data/ ve site/ için botun değişikliği geçerli olur.
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Değişiklikler 3 denemede de gönderilemedi." && exit 1
          fi
